# Camera Parameters. Adjust them!
#--------------------------------------------------------------------------------------------
Camera.type: "PinHole"

# Camera calibration and distortion parameters (OpenCV) 

# Valores base
Camera.fps: 30.0
Camera.width: 640
Camera.height: 480
Camera.fx: 686.2
Camera.fy: 686.2
Camera.cx: 320.0
Camera.cy: 240.0

